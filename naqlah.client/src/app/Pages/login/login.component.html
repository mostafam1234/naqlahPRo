<!-- Login Page - Naqlah Admin (Project theme: primary teal, neutral) -->
<div class="login-page min-h-screen flex items-center justify-center p-4 overflow-hidden" dir="rtl">
  <!-- Background -->
  <div class="login-bg">
    <div class="login-bg-gradient"></div>
    <div class="login-bg-shape login-bg-shape-1"></div>
    <div class="login-bg-shape login-bg-shape-2"></div>
    <div class="login-bg-shape login-bg-shape-3"></div>
    <div class="login-bg-grid"></div>
  </div>

  <div class="login-container w-full max-w-6xl mx-auto relative z-10">
    <div class="grid lg:grid-cols-2 gap-10 lg:gap-14 items-center">
      <!-- Right: Branding / Illustration (RTL) -->
      <div class="hidden lg:flex flex-col items-center justify-center px-4 py-8">
        <div class="login-illustration-wrap">
          <div class="login-illustration-glow"></div>
          <img src="../../../assets/images/Login.svg" alt="Login" class="login-illustration-img" />
        </div>
        <div class="text-center mt-8 max-w-sm">
          <h2 class="text-2xl lg:text-3xl font-bold text-neutral-800 mb-3">مرحباً بعودتك</h2>
          <p class="text-neutral-600 text-base lg:text-lg">قم بتسجيل الدخول للوصول إلى لوحة التحكم</p>
        </div>
      </div>

      <!-- Left: Form Card -->
      <div class="w-full max-w-[420px] mx-auto lg:mx-0">
        <div class="login-card">
          <div class="login-card-inner">
            <!-- Header -->
            <div class="text-center mb-8">
              <img src="../../../assets/images/car.png" alt="Naqlah" class="login-logo mx-auto mb-4" />
              <h1 class="text-xl lg:text-2xl font-bold text-neutral-800 mb-2">تسجيل الدخول</h1>
              <p class="text-neutral-500 text-sm">أدخل بياناتك للوصول إلى حسابك</p>
            </div>

            <form [formGroup]="loginFormGroup" (ngSubmit)="LogIn(loginFormGroup.value)" class="space-y-5">
              <!-- Global error -->
              <div *ngIf="errorMessage" class="login-error-box">
                <svg class="login-error-icon" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span class="text-error-700 text-sm font-medium">{{ errorMessage }}</span>
              </div>

              <!-- Email -->
              <div class="login-field">
                <label for="email" class="login-label">البريد الإلكتروني</label>
                <div class="login-input-wrap">
                  <span class="login-input-icon login-input-icon-start">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                    </svg>
                  </span>
                  <input
                    formControlName="userName"
                    id="email"
                    type="email"
                    placeholder="admin@example.com"
                    class="login-input"
                    [class.login-input-invalid]="hasFieldError('userName')"
                  />
                </div>
                <p *ngIf="hasFieldError('userName')" class="login-field-error">
                  <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                  </svg>
                  {{ getFieldError('userName') }}
                </p>
              </div>

              <!-- Password -->
              <div class="login-field">
                <label for="password" class="login-label">كلمة المرور</label>
                <div class="login-input-wrap">
                  <span class="login-input-icon login-input-icon-start">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                  </span>
                  <input
                    formControlName="password"
                    id="password"
                    [type]="showPassword ? 'text' : 'password'"
                    placeholder="••••••••"
                    class="login-input login-input-password"
                    [class.login-input-invalid]="hasFieldError('password')"
                  />
                  <button
                    type="button"
                    (click)="togglePasswordVisibility()"
                    class="login-password-toggle"
                    [attr.aria-label]="showPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
                  >
                    <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                    <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L12 12m-3-3l6.364 6.364M21 21l-3.6-3.6"/>
                    </svg>
                  </button>
                </div>
                <p *ngIf="hasFieldError('password')" class="login-field-error">
                  <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                  </svg>
                  {{ getFieldError('password') }}
                </p>
              </div>

              <!-- Forgot password -->
              <div class="text-left">
                <a href="#" class="login-link">نسيت كلمة المرور؟</a>
              </div>

              <!-- Submit -->
              <button
                type="submit"
                [disabled]="isSubmitting"
                class="login-submit"
              >
                <span *ngIf="!isSubmitting" class="login-submit-content">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                  </svg>
                  <span>تسجيل الدخول</span>
                </span>
                <span *ngIf="isSubmitting" class="login-submit-content">
                  <svg class="login-spinner w-5 h-5" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  <span>جارِ تسجيل الدخول...</span>
                </span>
              </button>
            </form>

            <div class="mt-8 text-center">
              <p class="text-xs text-neutral-400">
                بتسجيل الدخول، أنت توافق على
                <a href="#" class="text-primary-600 hover:text-primary-700 hover:underline">شروط الخدمة</a>
                و
                <a href="#" class="text-primary-600 hover:text-primary-700 hover:underline">سياسة الخصوصية</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
