<div class="flex flex-wrap items-center justify-center gap-4 border-t border-neutral-200 bg-neutral-50/80 px-6 py-4">
  <button type="button"
    [disabled]="!hasPrev || loading"
    (click)="goToPage(currentPage - 1)"
    aria-label="Previous page"
    class="inline-flex items-center gap-2 rounded-lg border border-neutral-300 bg-white px-4 py-2 text-sm font-semibold text-neutral-700 hover:bg-neutral-50 hover:border-primary-400 hover:text-primary-600 focus:ring-2 focus:ring-primary-500/20 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
    </svg>
    {{ 'ADMIN.AUDIT.PREV' | translate }}
  </button>
  <div class="flex flex-col items-center gap-0.5">
    <span class="text-sm font-semibold text-neutral-800">
      {{ 'ADMIN.AUDIT.PAGE' | translate }} {{ currentPage + 1 }} {{ 'ADMIN.AUDIT.OF' | translate }} {{ totalPages }}
    </span>
    <span class="text-xs text-neutral-500">{{ totalCount }} {{ 'ADMIN.AUDIT.RECORDS' | translate }}</span>
  </div>
  <button type="button"
    [disabled]="!hasNext || loading"
    (click)="goToPage(currentPage + 1)"
    aria-label="Next page"
    class="inline-flex items-center gap-2 rounded-lg border border-neutral-300 bg-white px-4 py-2 text-sm font-semibold text-neutral-700 hover:bg-neutral-50 hover:border-primary-400 hover:text-primary-600 focus:ring-2 focus:ring-primary-500/20 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
    {{ 'ADMIN.AUDIT.NEXT' | translate }}
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
    </svg>
  </button>
</div>
