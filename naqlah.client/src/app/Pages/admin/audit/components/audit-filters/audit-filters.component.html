<div class="rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-5">
    <div class="flex items-center gap-3">
      <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-primary-100 text-primary-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
        </svg>
      </div>
      <h3 class="text-lg font-semibold text-neutral-800">{{ 'ADMIN.AUDIT.FILTERS' | translate }}</h3>
    </div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-5">
    <div>
      <label for="fromDate" class="block text-sm font-medium text-neutral-600 mb-1.5">{{ 'ADMIN.AUDIT.FROM_DATE' | translate }}</label>
      <input id="fromDate" type="date" [(ngModel)]="model.fromDate"
        class="block w-full rounded-lg border border-neutral-300 bg-white px-3 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-colors"/>
    </div>
    <div>
      <label for="toDate" class="block text-sm font-medium text-neutral-600 mb-1.5">{{ 'ADMIN.AUDIT.TO_DATE' | translate }}</label>
      <input id="toDate" type="date" [(ngModel)]="model.toDate"
        class="block w-full rounded-lg border border-neutral-300 bg-white px-3 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-colors"/>
    </div>
    <div class="audit-entity-type-dropdown relative">
      <label for="entityTypeInput" class="block text-sm font-medium text-neutral-600 mb-1.5">{{ 'ADMIN.AUDIT.ENTITY_TYPE' | translate }}</label>
      <div (click)="openEntityTypeDropdown()" id="entityTypeInput" role="combobox" [attr.aria-expanded]="entityTypeDropdownOpen"
        class="flex cursor-pointer items-center justify-between rounded-lg border border-neutral-300 bg-white px-3 py-2.5 text-sm text-neutral-900 hover:border-neutral-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 min-h-[42px] transition-colors">
        <span class="truncate flex-1 text-right" [class.text-neutral-400]="!entityTypeDisplayText">
          {{ entityTypeDisplayText || ('ADMIN.AUDIT.ALL_ENTITY_TYPES' | translate) }}
        </span>
        <svg class="w-4 h-4 shrink-0 text-neutral-400 mr-1 transition-transform" [class.rotate-180]="entityTypeDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>
      <div *ngIf="entityTypeDropdownOpen" class="absolute z-10 mt-1 left-0 right-0 rounded-lg border border-neutral-200 bg-white shadow-lg max-h-60 overflow-hidden flex flex-col">
        <div class="p-2 border-b border-neutral-100 bg-neutral-50 sticky top-0">
          <input type="text" [(ngModel)]="entityTypeSearch" (click)="$event.stopPropagation()"
            class="block w-full rounded-md border border-neutral-300 bg-white px-2.5 py-1.5 text-sm text-neutral-900 placeholder-neutral-400 focus:border-primary-500 focus:ring-1 focus:ring-primary-500/20"
            [placeholder]="'ADMIN.AUDIT.SEARCH_ENTITY_TYPE' | translate" />
        </div>
        <div class="overflow-y-auto flex-1 min-h-0 py-1">
          <button type="button" (click)="clearEntityType(); $event.stopPropagation()"
            class="block w-full text-right px-3 py-2 text-sm text-neutral-600 hover:bg-neutral-50 transition-colors">
            {{ 'ADMIN.AUDIT.ALL_ENTITY_TYPES' | translate }}
          </button>
          <button *ngFor="let type of filteredEntityTypes" type="button" (click)="selectEntityType(type); $event.stopPropagation()"
            class="block w-full text-right px-3 py-2 text-sm text-neutral-900 hover:bg-primary-50 transition-colors"
            [class.bg-primary-50]="model.entityType === type" [class.font-semibold]="model.entityType === type">
            {{ type }}
          </button>
          <p *ngIf="filteredEntityTypes.length === 0" class="px-3 py-2 text-sm text-neutral-500">
            {{ 'ADMIN.AUDIT.NO_RECORDS' | translate }}
          </p>
        </div>
      </div>
    </div>
  </div>
  <div class="flex flex-wrap gap-3">
    <button type="button" (click)="onSearch()" [disabled]="loading"
      class="inline-flex items-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-700 focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed transition-all">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      {{ 'ADMIN.AUDIT.SEARCH' | translate }}
    </button>
    <button type="button" (click)="onClear()" [disabled]="loading"
      class="inline-flex items-center gap-2 rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-sm font-semibold text-neutral-700 hover:bg-neutral-50 focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 disabled:opacity-60 transition-all">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
      {{ 'ADMIN.AUDIT.CLEAR' | translate }}
    </button>
  </div>
</div>
