<!-- header.component.html -->
<header class="naqlah-header sticky top-0 z-50">
  <div class="naqlah-header__inner">
    <!-- Left: menu + brand -->
    <div class="naqlah-header__left">
      <button
        (click)="AppearSideBar()"
        class="naqlah-header__menu-btn"
        aria-label="Toggle sidebar"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="naqlah-header__brand hidden sm:flex">
        <div class="naqlah-header__brand-icon">
          <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5">
            <path d="M3 12h13l-3-3m3 3l-3 3M16 6h2a2 2 0 012 2v8a2 2 0 01-2 2h-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 18H5a2 2 0 01-2-2V8a2 2 0 012-2h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <span class="naqlah-header__brand-name">نقلة</span>
          <span class="naqlah-header__brand-sub">نقل ذكي · سريع · موثوق</span>
        </div>
      </div>
    </div>

    <!-- Right: actions -->
    <div class="naqlah-header__right animate-slide-in-right">

      <!-- Settings -->
      <div class="relative settings-dropdown-container">
        <button
          (click)="toggleSettingsDropdown()"
          class="naqlah-header__icon-btn"
          [class.naqlah-header__icon-btn--active]="settingsDropdownOpen"
          aria-label="Settings"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" [@settingsRotation]="settingsIconState">
            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>

        <div
          *ngIf="settingsDropdownOpen"
          class="naqlah-dropdown naqlah-dropdown--settings"
          [@dropdownAnimation]
          (click)="onDropdownClick($event)"
        >
          <div class="naqlah-dropdown__header">
            <h3>{{ 'ADMIN.HEADER.SETTINGS' | translate }}</h3>
          </div>
          <div class="naqlah-dropdown__body">
            <button
              *ngIf="hasPermission('CanViewProfile')"
              (click)="handleMenuClick('profile')"
              class="naqlah-dropdown__item"
            >
              <span class="naqlah-dropdown__item-icon naqlah-dropdown__item-icon--primary">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                </svg>
              </span>
              <span>{{ 'ADMIN.HEADER.PROFILE' | translate }}</span>
            </button>
            <button
              (click)="handleMenuClick('logout')"
              class="naqlah-dropdown__item naqlah-dropdown__item--danger"
            >
              <span class="naqlah-dropdown__item-icon naqlah-dropdown__item-icon--danger">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/>
                </svg>
              </span>
              <span>{{ 'ADMIN.HEADER.LOGOUT' | translate }}</span>
            </button>
          </div>
        </div>
      </div>

      <app-notifications></app-notifications>

      <!-- Theme toggle -->
      <button
        (click)="toggleTheme()"
        class="naqlah-header__theme-btn"
        [class.naqlah-header__theme-btn--active]="isDarkMode"
        [attr.aria-label]="isDarkMode ? 'وضع فاتح' : 'وضع داكن'"
        [title]="isDarkMode ? 'وضع فاتح' : 'وضع داكن'"
      >
        <!-- Moon: switch to dark -->
        <svg *ngIf="!isDarkMode" width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Sun: switch to light -->
        <svg *ngIf="isDarkMode" width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Language -->
      <div class="relative language-dropdown-container">
        <button
          (click)="toggleLanguageDropdown()"
          class="naqlah-header__lang-btn"
          [class.naqlah-header__lang-btn--active]="languageDropdownOpen"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
            <path d="M3 12H21M12 3c2.5 3 2.5 15 0 18C9.5 18 9.5 6 12 3Z" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span>{{ getCurrentLanguageDisplayName() }}</span>
          <svg class="w-3.5 h-3.5 transition-transform" [class.rotate-180]="languageDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <div
          *ngIf="languageDropdownOpen"
          class="naqlah-dropdown naqlah-dropdown--lang"
          [@dropdownAnimation]
          (click)="onDropdownClick($event)"
        >
          <div class="naqlah-dropdown__header">
            <h3>{{ 'ADMIN.HEADER.SELECT_LANGUAGE' | translate }}</h3>
          </div>
          <button
            class="naqlah-dropdown__lang-option"
            [class.naqlah-dropdown__lang-option--active]="isActiveLanguage('ar')"
            (click)="ChangeLanguage('rtl')"
            [disabled]="isActiveLanguage('ar')"
          >
            <img src="https://flagsapi.com/EG/flat/64.png" alt="Arabic" class="w-6 h-6 rounded-full object-cover"/>
            <div class="flex-1 text-right">
              <div class="text-sm font-semibold" style="color: var(--shell-text)">العربية</div>
              <div class="text-xs" style="color: var(--shell-text-muted)">{{ 'ADMIN.HEADER.ARABIC' | translate }}</div>
            </div>
            <svg *ngIf="isActiveLanguage('ar')" class="w-5 h-5 text-primary-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
          </button>
          <button
            class="naqlah-dropdown__lang-option"
            [class.naqlah-dropdown__lang-option--active]="isActiveLanguage('en')"
            (click)="ChangeLanguage('ltr')"
            [disabled]="isActiveLanguage('en')"
          >
            <img src="https://flagsapi.com/GB/flat/64.png" alt="English" class="w-6 h-6 rounded-full object-cover"/>
            <div class="flex-1 text-left">
              <div class="text-sm font-semibold" style="color: var(--shell-text)">English</div>
              <div class="text-xs" style="color: var(--shell-text-muted)">{{ 'ADMIN.HEADER.ENGLISH' | translate }}</div>
            </div>
            <svg *ngIf="isActiveLanguage('en')" class="w-5 h-5 text-primary-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
          </button>
          <div class="naqlah-dropdown__footer">
            <p>{{ 'ADMIN.HEADER.PAGE_WILL_RELOAD' | translate }}</p>
          </div>
        </div>
      </div>

      <!-- User -->
      <div class="naqlah-header__user hidden md:flex">
        <div class="naqlah-header__user-info">
          <span class="naqlah-header__user-email">{{ userEmail || 'User' }}</span>
          <span class="naqlah-header__user-role">{{ userRole || 'Admin' }}</span>
        </div>
        <div class="naqlah-header__avatar">
          {{ getUserInitial() }}
          <span class="naqlah-header__avatar-status"></span>
        </div>
      </div>
    </div>
  </div>
</header>
