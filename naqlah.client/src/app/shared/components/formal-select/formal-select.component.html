<div class="na-formal-select na-formal-select--wide" [class.na-formal-select--open]="isOpen" [class.na-formal-select--disabled]="disabled">
  <label *ngIf="label" class="na-formal-select__label">{{ label }}</label>

  <button
    #triggerBtn
    type="button"
    class="na-formal-select__trigger"
    [disabled]="disabled || loading"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen"
  >
    <span class="na-formal-select__value" [class.na-formal-select__value--placeholder]="!displayText">
      <ng-container *ngIf="loading">جاري التحميل...</ng-container>
      <ng-container *ngIf="!loading">{{ displayText || placeholder }}</ng-container>
    </span>
    <span class="na-formal-select__meta" *ngIf="!loading && selectedOption?.hint">{{ selectedOption?.hint }}</span>
    <svg class="na-formal-select__chevron" [class.na-formal-select__chevron--open]="isOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <div *ngIf="isOpen" #panel class="na-formal-select__panel na-formal-select__panel--wide na-formal-select__panel--floating">
    <div *ngIf="searchable" class="na-formal-select__search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input type="text" [(ngModel)]="searchTerm" placeholder="ابحث..." (click)="$event.stopPropagation()" />
    </div>

    <div class="na-formal-select__list">
      <button
        type="button"
        *ngFor="let opt of filteredOptions"
        class="na-formal-select__option"
        [class.na-formal-select__option--selected]="value === opt.value"
        (click)="select(opt.value); $event.stopPropagation()"
      >
        <span class="na-formal-select__option-label">{{ opt.label }}</span>
        <span class="na-formal-select__option-hint" *ngIf="opt.hint">{{ opt.hint }}</span>
      </button>
      <p *ngIf="filteredOptions.length === 0" class="na-formal-select__empty">لا توجد نتائج</p>
    </div>

    <div class="na-formal-select__footer">
      <button
        type="button"
        class="na-formal-select__footer-clear"
        [disabled]="!clearable || !hasSelection"
        (click)="clearSelection($event)"
      >مسح</button>
      <button type="button" class="na-formal-select__footer-done" (click)="close(); $event.stopPropagation()">تم</button>
    </div>
  </div>
</div>
