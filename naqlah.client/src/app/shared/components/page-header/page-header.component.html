<header class="ph" role="banner">
  <div class="ph__body">
    <div class="ph__main">
      <div class="ph__icon" aria-hidden="true">
        <svg class="ph__icon-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            [attr.d]="iconPath"
          ></path>
        </svg>
      </div>

      <div class="ph__text">
        <h1 class="ph__title">{{ title | translate }}</h1>
        <p class="ph__subtitle" *ngIf="subtitle">{{ subtitle | translate }}</p>
      </div>
    </div>

    <div class="ph__actions">
      <ng-content></ng-content>
      <button
        *ngIf="showBackButton"
        type="button"
        class="ph__back"
        (click)="onBack()"
      >
        <svg class="ph__back-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span>{{ 'COMMON.BACK' | translate }}</span>
      </button>
    </div>
  </div>
</header>
